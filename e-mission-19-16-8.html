<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-mission — McDonald’s Maroc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#13161A; --surface:#1C2024; --surface-hover:#1F242A; --surface-alt:#15181C;
    --border:#2A2F35; --border-hover:#3A4047; --input-bg:#13161A;
    --text:#E8EAED; --text-dim:#C5C9CE; --text-mute:#8B9199; --text-faint:#6B7280; --text-ghost:#5C636B;
    --orange:#FF6B35; --orange-hover:#FF7D4D;
    --green:#2BB673; --yellow:#E8B339; --blue:#4A9FE8; --purple:#9B8AE8; --red:#FF3B3B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .font-display{font-family:'Archivo',sans-serif; font-weight:700; letter-spacing:0.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  button{cursor:pointer; font-family:inherit; border:none; background:none;}
  input,select,textarea{font-family:inherit; color:var(--text);}
  input:focus,select:focus,textarea:focus{outline:none;}
  a{text-decoration:none;}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Layout */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    display:none; flex-direction:column; width:224px; border-right:1px solid var(--border);
    background:var(--surface-alt); min-height:100vh; position:sticky; top:0;
  }
  .sidebar-header{padding:20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px;}
  .sidebar-logo{width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
  .sidebar-logo img{width:100%; height:100%; object-fit:contain;}
  .sidebar-title{font-size:13px; color:var(--text);}
  .sidebar-sub{font-size:10px; color:var(--text-ghost); font-family:'JetBrains Mono',monospace;}
  .nav{flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:4px; overflow-y:auto;}
  .nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-ghost); padding:12px 12px 4px;}
  .nav-item{
    width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px;
    font-size:14px; font-weight:500; color:var(--text-mute); transition:all .15s;
  }
  .nav-item:hover{background:var(--surface); color:var(--text);}
  .nav-item.active{background:rgba(255,107,53,0.1); color:var(--orange);}
  .sidebar-footer{padding:16px 12px; border-top:1px solid var(--border);}
  .user-card{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; background:var(--surface);}
  .avatar{width:28px; height:28px; border-radius:50%; background:#23282E; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:var(--text-mute); flex-shrink:0;}
  .sync-status{display:flex; align-items:center; gap:6px; margin-top:12px; font-size:10px; color:var(--text-ghost); font-family:'JetBrains Mono',monospace; padding:0 4px;}
  .dot-green{width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0;}

  .topbar-mobile{
    display:flex; position:fixed; top:0; left:0; right:0; z-index:40; background:var(--surface-alt);
    border-bottom:1px solid var(--border); padding:12px 16px; align-items:center; justify-content:space-between;
  }
  .mobile-nav{display:none; position:fixed; top:53px; left:0; right:0; z-index:40; background:var(--surface-alt); border-bottom:1px solid var(--border); padding:12px; flex-direction:column; gap:4px; max-height:calc(100vh - 53px); overflow-y:auto;}
  .mobile-nav.open{display:flex;}

  main{flex:1; padding:24px 16px; padding-top:80px; max-width:1400px;}

  @media (min-width:768px){
    .sidebar{display:flex;}
    .topbar-mobile{display:none;}
    main{padding:32px 32px; padding-top:32px;}
  }
  @media (min-width:640px){
    main{padding-left:24px; padding-right:24px;}
  }

  /* Generic */
  .page-header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:24px;}
  .page-title{font-size:20px; color:var(--text); text-transform:uppercase;}
  .page-sub{font-size:14px; color:var(--text-faint); margin-top:2px;}
  .btn-primary{
    display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:6px;
    background:var(--orange); color:white; font-size:14px; font-weight:600; transition:background .15s; white-space:nowrap;
  }
  .btn-primary:hover{background:var(--orange-hover);}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-secondary{
    padding:10px; border-radius:6px; font-size:14px; font-weight:500; color:var(--text-mute);
    border:1px solid var(--border); transition:background .15s;
  }
  .btn-secondary:hover{background:#23282E;}
  .btn-danger{
    padding:10px; border-radius:6px; font-size:14px; font-weight:500; color:var(--red);
    border:1px solid rgba(255,59,59,0.3); transition:background .15s;
  }
  .btn-danger:hover{background:rgba(255,59,59,0.08);}
  .btn-ghost{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text-mute); transition:color .15s;}
  .btn-ghost:hover{color:var(--text);}
  .icon-btn{display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:6px; color:var(--text-faint); transition:all .15s; flex-shrink:0;}
  .icon-btn:hover{background:var(--surface-hover); color:var(--text);}
  .icon-btn.danger:hover{background:rgba(255,59,59,0.1); color:var(--red);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:6px;}
  .card-header{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); gap:8px; flex-wrap:wrap;}
  .card-title{font-size:12px; letter-spacing:0.05em; color:var(--text-dim); text-transform:uppercase; font-family:'Archivo',sans-serif; font-weight:700;}

  .grid-kpi{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:24px;}
  @media (min-width:640px){.grid-kpi{grid-template-columns:repeat(3,1fr);}}
  @media (min-width:1024px){.grid-kpi{grid-template-columns:repeat(6,1fr);}}

  .kpi{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:16px; overflow:hidden; transition:border-color .15s;}
  .kpi:hover{border-color:var(--border-hover);}
  .kpi-bar{position:absolute; top:0; left:0; width:100%; height:2px;}
  .kpi-icon-row{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}
  .kpi-icon{width:32px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center;}
  .kpi-value{font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:600; color:var(--text);}
  .kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-mute); margin-top:4px; font-weight:500;}
  .kpi-trend{display:flex; align-items:center; gap:2px; font-size:11px; font-family:'JetBrains Mono',monospace;}

  .pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:600; letter-spacing:0.02em; white-space:nowrap;}
  .prio{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; white-space:nowrap;}
  .prio-dot{width:6px; height:6px; border-radius:50%;}
  .estatus{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; white-space:nowrap;}
  .estatus-dot{width:6px; height:6px; border-radius:50%;}

  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:64px 16px; text-align:center;}
  .empty-icon{width:48px; height:48px; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin-bottom:16px;}
  .empty-title{font-size:14px; font-weight:500; color:var(--text-dim); margin-bottom:4px;}
  .empty-body{font-size:12px; color:var(--text-faint); max-width:280px;}

  .search-wrap{position:relative; flex:1; min-width:200px;}
  .search-wrap svg, .search-wrap i{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-ghost); pointer-events:none;}
  .input, select.input{
    width:100%; background:var(--input-bg); border:1px solid var(--border); border-radius:6px;
    padding:9px 12px; font-size:14px; color:var(--text); transition:border-color .15s;
  }
  .input::placeholder{color:var(--text-ghost);}
  .input:focus, select.input:focus{border-color:var(--orange);}
  .search-wrap .input{padding-left:36px;}
  textarea.input{resize:none;}
  label.field-label{display:block; font-size:12px; font-weight:500; color:var(--text-mute); margin-bottom:6px;}
  .field-hint{font-size:11px; color:var(--text-ghost); margin-top:4px;}

  .filters-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px;}

  .equip-grid{display:grid; grid-template-columns:1fr; gap:12px;}
  @media (min-width:640px){.equip-grid{grid-template-columns:repeat(2,1fr);}}
  @media (min-width:1024px){.equip-grid{grid-template-columns:repeat(3,1fr);}}
  .equip-card{background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:16px; cursor:pointer; transition:border-color .15s;}
  .equip-card:hover{border-color:var(--border-hover);}
  .equip-card:hover .equip-name{color:var(--orange);}
  .equip-card-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}
  .equip-cat-icon{width:36px; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center;}
  .equip-id{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-ghost);}
  .equip-name{font-size:14px; font-weight:500; color:var(--text); margin-bottom:4px; transition:color .15s;}
  .equip-brand{font-size:12px; color:var(--text-faint); margin-bottom:12px;}
  .equip-foot{display:flex; align-items:center; justify-content:space-between;}
  .equip-loc{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-faint);}

  .list-row{padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:background .15s; flex-wrap:wrap; border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--surface-hover);}
  .list-row.highlight{background:rgba(255,107,53,0.05);}
  .list-row.no-hover{cursor:default;}

  .status-filter-row{display:flex; align-items:center; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px;}
  .status-chip{flex-shrink:0; display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; border:1px solid var(--border); color:var(--text-mute); white-space:nowrap; transition:all .15s;}
  .status-chip.active-all{background:var(--text); color:var(--bg);}

  .detail-back{margin-bottom:20px;}
  .detail-header-card{background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-bottom:20px;}
  .detail-header-bar{height:4px;}
  .detail-header-body{padding:20px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .detail-header-left{display:flex; align-items:flex-start; gap:16px;}
  .detail-icon-lg{width:56px; height:56px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .detail-id{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-ghost); margin-bottom:4px;}
  .detail-title{font-size:18px; color:var(--text); text-transform:uppercase;}
  .detail-meta-row{display:flex; align-items:center; gap:12px; margin-top:6px; flex-wrap:wrap;}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .detail-grid{display:grid; grid-template-columns:1fr; gap:20px;}
  @media (min-width:1024px){.detail-grid{grid-template-columns:2fr 1fr;}}
  .detail-col{display:flex; flex-direction:column; gap:20px;}

  .specs-grid{padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .spec-label{font-size:11px; color:var(--text-ghost); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:2px;}
  .spec-value{font-size:14px; color:var(--text); font-family:'JetBrains Mono',monospace;}
  .warranty-badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px; border-radius:4px; margin:0 16px 16px;}

  .doc-item{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:6px; background:var(--input-bg); border:1px solid var(--border); font-size:12px; color:var(--text-mute); cursor:pointer; transition:all .15s; margin-bottom:8px;}
  .doc-item:hover{color:var(--text); border-color:var(--border-hover);}

  .qr-box{display:flex; flex-direction:column; align-items:center; padding:12px 0;}
  .qr-grid{width:112px; height:112px; background:white; border-radius:6px; padding:8px; display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr); gap:2px;}
  .qr-cell-on{background:black;}
  .qr-cell-off{background:white;}

  .bar-track{flex:1; height:8px; background:var(--input-bg); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; transition:width .3s;}
  .bar-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .bar-row:last-child{margin-bottom:0;}

  /* Modal */
  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
    align-items:center; justify-content:center; padding:0;
  }
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:8px 8px 0 0; width:100%; max-height:90vh; overflow-y:auto;}
  @media (min-width:640px){.modal{border-radius:8px; max-width:520px;} .modal.wide{max-width:620px;} .modal.narrow{max-width:420px;}}
  .modal-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface);}
  .modal-body{padding:20px; display:flex; flex-direction:column; gap:16px;}
  .modal-footer{display:flex; gap:12px; padding:16px 20px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface);}
  .modal-footer button{flex:1; padding:10px;}
  .close-btn{color:var(--text-faint); transition:color .15s;}
  .close-btn:hover{color:var(--text);}

  .seg-row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .seg-btn{padding:8px; border-radius:6px; font-size:12px; font-weight:600; border:1px solid var(--border); color:var(--text-faint); transition:all .15s;}
  .cat-row{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
  .cat-btn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:6px; border:1px solid var(--border); transition:all .15s;}
  .cat-btn span{font-size:10px; font-weight:500;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .three-col{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}

  /* Ticket detail */
  .desc-block{font-size:14px; color:var(--text-dim); line-height:1.6; margin-top:16px;}
  .journal-scroll{padding:16px; display:flex; flex-direction:column; gap:12px; max-height:320px; overflow-y:auto;}
  .note-row{display:flex; gap:12px;}
  .note-author-line{display:flex; align-items:center; gap:8px;}
  .note-author{font-size:12px; font-weight:500; color:var(--text-dim);}
  .note-time{font-size:11px; color:var(--text-ghost);}
  .note-text{font-size:14px; color:#A8ADB4; margin-top:2px;}
  .journal-input-row{display:flex; gap:8px; padding:16px; border-top:1px solid var(--border);}
  .journal-input-row .input{flex:1;}
  .journal-input-row button{padding:9px 14px; border-radius:6px; background:#23282E; color:var(--text); font-size:14px; font-weight:500; border:1px solid var(--border); transition:background .15s; white-space:nowrap;}
  .journal-input-row button:hover{background:#2A3038;}

  .status-btn-list{display:flex; flex-direction:column; gap:6px;}
  .status-btn{width:100%; display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:6px; font-size:12px; font-weight:500; border:1px solid var(--border); color:var(--text-mute); transition:all .15s;}

  .upload-box{width:100%; display:flex; flex-direction:column; align-items:center; gap:6px; padding:24px; border-radius:6px; border:1.5px dashed var(--border); color:var(--text-ghost); transition:all .15s;}
  .upload-box:hover{border-color:var(--border-hover); color:var(--text-mute);}

  /* Prestataires */
  .provider-card{background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:16px; cursor:pointer; transition:border-color .15s;}
  .provider-card:hover{border-color:var(--border-hover);}
  .provider-card:hover .provider-name{color:var(--orange);}
  .provider-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; gap:8px;}
  .provider-avatar{width:40px; height:40px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; font-family:'Archivo',sans-serif;}
  .provider-name{font-size:14px; font-weight:500; color:var(--text); transition:color .15s;}
  .type-badge{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; padding:2px 7px; border-radius:4px; text-transform:uppercase; letter-spacing:0.03em;}
  .stars-row{display:inline-flex; align-items:center; gap:2px;}
  .star{width:13px; height:13px;}

  .provider-grid{display:grid; grid-template-columns:1fr; gap:12px;}
  @media (min-width:640px){.provider-grid{grid-template-columns:repeat(2,1fr);}}
  @media (min-width:1024px){.provider-grid{grid-template-columns:repeat(3,1fr);}}

  .rating-input{display:flex; gap:4px;}
  .rating-input button{padding:2px;}

  /* Settings */
  .settings-tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;}
  .settings-tab{padding:10px 16px; font-size:13px; font-weight:600; color:var(--text-faint); border-bottom:2px solid transparent; transition:all .15s; white-space:nowrap;}
  .settings-tab.active{color:var(--orange); border-bottom-color:var(--orange);}
  .config-row{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border);}
  .config-row:last-child{border-bottom:none;}
  .config-swatch{width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .color-swatch-row{display:flex; gap:6px; flex-wrap:wrap;}
  .color-swatch{width:28px; height:28px; border-radius:6px; border:2px solid transparent; cursor:pointer; transition:all .15s;}
  .color-swatch.selected{border-color:white; transform:scale(1.1);}
  .add-row-form{display:flex; gap:8px; padding:16px; border-top:1px solid var(--border); flex-wrap:wrap;}
  .add-row-form .input{flex:1; min-width:140px;}

  .hide-mobile{display:none;}
  @media (min-width:640px){.hide-mobile{display:block;}}

  .hide{display:none !important;}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============================================================
   CONNEXION SUPABASE (backend distant multi-utilisateurs)
   ============================================================
   1. Créez un projet gratuit sur https://supabase.com
   2. Exécutez le script supabase-schema.sql fourni dans l'éditeur SQL du projet
   3. Récupérez l'URL du projet et la clé "anon public" (Project Settings > API)
   4. Collez-les ci-dessous
   ============================================================ */
const SUPABASE_URL = "https://fwvzpmtfvshzqjkzfahh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ieLa45GSEDX5O1PnefSPaQ_Q8xgdldO";

const supabaseClient = (SUPABASE_URL.includes("VOTRE-PROJET") || SUPABASE_ANON_KEY.includes("VOTRE_CLE"))
  ? null
  : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   CONFIGURATION PAR DÉFAUT (modifiable via Paramètres)
   ============================================================ */

const COLOR_PALETTE = ["#FF6B35","#E8B339","#4A9FE8","#2BB673","#9B8AE8","#FF3B3B","#4DD4C9","#E85A8C"];
const ICON_PALETTE = ["flame","snowflake","gauge","activity","wind","zap","droplet","box","settings-2","thermometer"];

const DEFAULT_CATEGORIES = [
  { id: "friture", label: "Friture", icon: "flame", color: "#FF6B35" },
  { id: "cuisson", label: "Cuisson", icon: "flame", color: "#E8B339" },

const PEP_GENERIC_NOTE = "Aucune tâche du Calendrier PEP McDonald's n'est référencée pour ce modèle d'équipement précis. Si des procédures existent pour ce matériel, elles peuvent être ajoutées manuellement à la documentation du restaurant.";

function getPepSheetsForCategory(categoryId) {
  return PEP_SHEETS[categoryId] || [];
}

// Normalise une chaîne pour comparaison (minuscules, sans accents, sans ponctuation)
function normalizeForMatch(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

// Extrait les mots significatifs (≥3 caractères, hors mots génériques) d'une chaîne.
// Un stemming très simple (retrait du "s" final) absorbe les variations singulier/pluriel
// (ex: "chambre" / "chambres", "froide" / "froides").
const PEP_MATCH_STOPWORDS = new Set([
  "general","generale","tous","toutes","modeles","modele","machine","systeme",
  // mots-catégorie trop génériques : présents dans le nom de quasi tous les équipements
  // d'une catégorie, ils provoqueraient des correspondances avec des modèles différents
  "toaster","toasters","gril","grils","four","fours","friteuse","friteuses",
  "boisson","boissons","tourelle","tourelles","cuve","unite","transition",
  "vertical","verticale","horizontal","horizontale","unité",
]);
function stem(word) {
  return word.length > 4 && word.endsWith("s") ? word.slice(0, -1) : word;
}
function significantWords(str) {
  return normalizeForMatch(str).split(" ")
    .filter(w => w.length >= 3 && !PEP_MATCH_STOPWORDS.has(w))
    .map(stem);
}

// Liste de tous les mots-modèle distincts utilisés dans les fiches PEP d'une catégorie
// (sert à détecter si un équipement a un identifiant de modèle réellement spécifique)
function categoryModelVocabulary(categoryId) {
  const vocab = new Set();
  getPepSheetsForCategory(categoryId).forEach(s => significantWords(s.model).forEach(w => vocab.add(w)));
  return vocab;
}

// Ne garde que les fiches PEP dont le champ "model" correspond à la marque/modèle/nom de l'équipement précis
function getPepSheetsForEquipment(eq) {
  const all = getPepSheetsForCategory(eq.category);
  const eqWords = new Set([
    ...significantWords(eq.brand),
    ...significantWords(eq.model),
    ...significantWords(eq.name),
  ]);

  // Si l'équipement ne porte aucun terme reconnu dans le vocabulaire des modèles PEP de sa
  // catégorie (cas d'un équipement générique, sans marque/modèle technique renseigné),
  // on ne peut pas filtrer finement : on affiche l'ensemble des tâches de la catégorie.
  const vocab = categoryModelVocabulary(eq.category);
  const hasSpecificMatch = [...eqWords].some(w => vocab.has(w));
  if (!hasSpecificMatch) return all;

  return all.filter(sheet => {
    const sheetWords = significantWords(sheet.model);
    if (sheetWords.length === 0) return false;
    return sheetWords.some(w => eqWords.has(w));
  });

function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// Génère le parc de 100 restaurants à partir du standard SEED_EQUIPMENT, avec des
// variations aléatoires (mais reproductibles) de statuts et d'activation par site.
function generateRestaurantsRegistry() {
  const restaurants = [];
  for (let i = 1; i <= 100; i++) {
    const cycle = Math.floor((i - 1) / RESTAURANT_CITIES.length); // 0 au premier passage, 1 au second...
    const entry = RESTAURANT_CITIES[(i - 1) % RESTAURANT_CITIES.length];
    const city = cycle === 0 ? entry.city : `${entry.city} ${cycle + 1}`;
    const id = `R${String(i).padStart(3, "0")}`;
    const equipCount = SEED_EQUIPMENT.length;
    restaurants.push({
      id,
      name: `McDonald's ${city}`,
      number: `${10000 + i}`,
      city,
      market: entry.market,
      storeManager: "—",
      supervisor: "—",
      equipCount,
      inactiveCount: 0,
      panneCount: 0,
      seed: 1000 + i * 37,
    });
  }
  return restaurants;
}

function storageKey(key) {
  return state.activeRestaurantId ? `${state.activeRestaurantId}:${key}` : key;
}

/* Stockage : table kv_store sur Supabase (partagée en temps réel entre tous les utilisateurs
   connectés à distance). Repli local (localStorage) uniquement si Supabase n'est pas configuré,
   pour permettre de tester l'app hors-ligne. */
const LOCAL_STORAGE_PREFIX = "e-mission:";

async function loadShared(key, fallback) {
  const k = storageKey(key);
  try {
    if (supabaseClient) {
      const { data, error } = await supabaseClient.from("kv_store").select("value").eq("key", k).maybeSingle();
      if (error) throw error;
      return data ? data.value : fallback;
    }
    const raw = localStorage.getItem(LOCAL_STORAGE_PREFIX + k);
    return raw !== null ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
async function saveShared(key, value) {
  const k = storageKey(key);
  try {
    if (supabaseClient) {
      const { error } = await supabaseClient.from("kv_store").upsert({ key: k, value, updated_at: new Date().toISOString() });
      if (error) throw error;
    } else {
      localStorage.setItem(LOCAL_STORAGE_PREFIX + k, JSON.stringify(value));
    }
    return true;
  } catch {
    return false;
  }
}

function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function formatDate(iso) {
  if (!iso || iso === "—") return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
}
function formatDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) + " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const hours = Math.floor(diff / 3600000);
  if (hours < 1) return "à l'instant";
  if (hours < 24) return `il y a ${hours}h`;
  return `il y a ${Math.floor(hours / 24)}j`;
}
function slugify(label) {
  return label.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "item_" + Date.now();
}

/* Normalise une heure saisie sous différents formats ("10H00", "10h00", "10:00")
   vers le format HH:MM attendu par un <input type="time">. */
function toTimeInputValue(str) {
  if (!str) return "";
  const m = String(str).trim().match(/^(\d{1,2})[:hH](\d{2})$/);
  if (!m) return "";
  return `${m[1].padStart(2,"0")}:${m[2]}`;
}
function nowTimeValue() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function todayDateValue() {
  return new Date().toISOString().slice(0,10);
}
function genTicketId(existing) {
  const year = new Date().getFullYear();
  const nums = existing.filter(t => t.id.startsWith(`TK-${year}`)).map(t => parseInt(t.id.split("-")[2], 10));
  return `TK-${year}-${String((nums.length ? Math.max(...nums) : 300) + 1).padStart(4, "0")}`;
}
function genEquipId(existing) {
  const nums = existing.map(e => parseInt(e.id.split("-")[1], 10));
  return `EQ-${String((nums.length ? Math.max(...nums) : 100) + 1).padStart(4, "0")}`;
}
function genProviderId(existing) {
  const nums = existing.map(p => parseInt(p.id.split("-")[1], 10));
  return `PR-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0")}`;
}
function initials(name) {
  return name.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase();
}
function icon(name, size = 16, extraAttrs = "") {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px;" ${extraAttrs}></i>`;
}
function starsHtml(rating, size = 13) {
  let out = `<span class="stars-row">`;
  for (let i = 1; i <= 5; i++) {
    const filled = i <= rating;
    out += `<i data-lucide="star" class="star" style="width:${size}px;height:${size}px;color:${filled ? '#E8B339' : '#3A4047'};fill:${filled ? '#E8B339' : 'none'}"></i>`;
  }
  out += `</span>`;
  return out;
}

  const t = map[type];
  return `<span class="type-badge" style="background:${t.color}1F;color:${t.color}">${t.label}</span>`;
}
function kpiHtml({icon: ic, label, value, sub, accent, trend}) {
  let trendHtml = "";
  if (trend) {
    const down = trend.startsWith("-");
    trendHtml = `<span class="kpi-trend" style="color:${down ? '#2BB673' : '#FF6B35'}">${icon(down ? "trending-down" : "trending-up", 11)}${trend}</span>`;
  }
  return `
    <div class="kpi">
      <div class="kpi-bar" style="background:${accent}"></div>
      <div class="kpi-icon-row">
        <div class="kpi-icon" style="background:${accent}1A">${icon(ic, 16, `style="width:16px;height:16px;color:${accent}"`)}</div>
        ${trendHtml}
      </div>
      <div class="kpi-value">${esc(value)}</div>
      <div class="kpi-label">${esc(label)}</div>
      ${sub ? `<div style="font-size:12px;color:var(--text-ghost);margin-top:4px;">${esc(sub)}</div>` : ""}
    </div>`;
}
function emptyHtml(ic, title, body) {
  return `
    <div class="empty">
      <div class="empty-icon">${icon(ic, 20, 'style="width:20px;height:20px;color:var(--text-ghost)"')}</div>
      <div class="empty-title">${esc(title)}</div>
      <div class="empty-body">${esc(body)}</div>
    </div>`;
}

function renderDashboard() {
  const { tickets, providers } = state;
  const equipment = state.equipment.filter(e => e.active !== false);
  const today = new Date().toDateString();
  const todayTickets = tickets.filter(t => new Date(t.createdAt).toDateString() === today);
  const critical = equipment.filter(e => e.criticality === "critique");
  const inPanne = equipment.filter(e => e.status === "panne");
  const operational = equipment.filter(e => e.status === "operational").length;
  const availability = equipment.length ? Math.round((operational / equipment.length) * 100) : 100;
  const recentTickets = [...tickets].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0,5);

  const kpis = [
    kpiHtml({icon:"boxes", label:"Équipements", value: equipment.length, accent:"#4A9FE8"}),

    kpiHtml({icon:"shield-check", label:"Équip. critiques", value: critical.length, accent:"#9B8AE8"}),
    kpiHtml({icon:"gauge", label:"Disponibilité", value: availability + "%", accent:"#2BB673", trend:"+2%"}),

    inPanne.map(eq => `

        <div style="width:32px;height:32px;border-radius:6px;background:rgba(255,59,59,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">${icon("alert-triangle",14,'style="width:14px;height:14px;color:#FF3B3B"')}</div>
        <div style="flex:1;min-width:0;">

          <div style="font-size:12px;color:var(--text-faint);">${esc(eq.location)}</div>
        </div>
      </div>`).join("");

  const statusBars = state.config.ticketStatuses.map(s => {
    const count = tickets.filter(t => t.status === s.id).length;
    const pct = tickets.length ? (count/tickets.length)*100 : 0;

function renderEquipmentList() {
  const { equipment, filters, config } = state;
  const filtered = equipment.filter(eq => {
    const s = filters.equipSearch.toLowerCase();
    const matchSearch = !s || eq.name.toLowerCase().includes(s) || eq.id.toLowerCase().includes(s) || eq.serial.toLowerCase().includes(s);
    const matchCat = filters.equipCategory === "all" || eq.category === filters.equipCategory;
    const matchStatus = filters.equipStatus === "all" || eq.status === filters.equipStatus;
    const matchActive = filters.equipActive === "all" || (filters.equipActive === "active" ? eq.active !== false : eq.active === false);
    return matchSearch && matchCat && matchStatus && matchActive;
  });

  // Regroupe les machines dupliquées (ex: "Gril Taylor", "Gril Taylor #2") côte à côte dans la grille
  const baseName = (n) => n.replace(/\s*#\d+\s*$/, "").trim();
  filtered.sort((a, b) => {
    const baseCompare = baseName(a.name).localeCompare(baseName(b.name), "fr");
    if (baseCompare !== 0) return baseCompare;
    return a.name.localeCompare(b.name, "fr", { numeric: true });
  });

  const catOptions = config.categories.map(c => `<option value="${c.id}" ${filters.equipCategory===c.id?"selected":""}>${esc(c.label)}</option>`).join("");
  const activeCount = equipment.filter(e => e.active !== false).length;
  const inactiveCount = equipment.length - activeCount;

  const cardsHtml = filtered.length === 0 ? emptyHtml("search","Aucun équipement trouvé","Essayez d'ajuster votre recherche ou vos filtres, ou ajoutez un équipement.") :
    `<div class="equip-grid">` + filtered.map(eq => {
      const cat = getCategory(eq.category);
      const isActive = eq.active !== false;
      return `
        <div class="equip-card" data-action="goto-equip" data-id="${eq.id}" style="${isActive ? "" : "opacity:0.55;"}">
          <div class="equip-card-top">
            <div class="equip-cat-icon" style="background:${cat.color}1A">${icon(cat.icon,16,`style="width:16px;height:16px;color:${cat.color}"`)}</div>
            <span class="equip-id">${eq.id}</span>
            <div style="margin-left:auto;display:flex;gap:2px;">
              <button class="icon-btn" data-action="duplicate-equip" data-id="${eq.id}" title="Dupliquer cette machine">${icon("copy-plus", 16)}</button>
              <button class="icon-btn" data-action="toggle-equip-active" data-id="${eq.id}" title="${isActive ? "Désactiver pour ce restaurant" : "Activer pour ce restaurant"}">
                ${icon(isActive ? "toggle-right" : "toggle-left", 18, `style="color:${isActive ? "#2BB673" : "var(--text-ghost)"}"`)}
              </button>
            </div>
          </div>
          <div class="equip-name">${esc(eq.name)}</div>
          <div class="equip-brand">${esc(eq.brand)} · ${esc(eq.model)}</div>
          <div class="equip-foot">
            <span class="equip-loc">${icon("map-pin",11)} ${esc(eq.location)}</span>
            ${isActive ? equipStatusDotHtml(eq.status) : `<span class="estatus" style="color:var(--text-ghost)">${icon("eye-off",12)} Inactif</span>`}
          </div>
        </div>`;
    }).join("") + `</div>`;

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title font-display">Parc équipements</h1>
        <p class="page-sub">${activeCount} équipement${activeCount>1?"s":""} actif${activeCount>1?"s":""}${inactiveCount ? ` · ${inactiveCount} inactif${inactiveCount>1?"s":""}` : ""}</p>
      </div>
      <button class="btn-primary" data-action="open-new-equip">${icon("plus",15)} Ajouter</button>
    </div>
    <div class="filters-row">
      <div class="search-wrap">
        ${icon("search",14)}
        <input class="input" id="equip-search" placeholder="Rechercher par nom, ID, n° série..." value="${esc(filters.equipSearch)}" />
      </div>
      <select class="input" id="equip-cat-filter" style="width:auto;"><option value="all" ${filters.equipCategory==="all"?"selected":""}>Toutes catégories</option>${catOptions}</select>
      <select class="input" id="equip-status-filter" style="width:auto;">
        <option value="all" ${filters.equipStatus==="all"?"selected":""}>Tous statuts</option>
        <option value="operational" ${filters.equipStatus==="operational"?"selected":""}>Opérationnel</option>
        <option value="panne" ${filters.equipStatus==="panne"?"selected":""}>En panne</option>
        <option value="maintenance" ${filters.equipStatus==="maintenance"?"selected":""}>En maintenance</option>
      </select>
      <select class="input" id="equip-active-filter" style="width:auto;">
        <option value="active" ${filters.equipActive==="active"?"selected":""}>Équipements actifs</option>
        <option value="inactive" ${filters.equipActive==="inactive"?"selected":""}>Équipements inactifs</option>
        <option value="all" ${filters.equipActive==="all"?"selected":""}>Tous (actifs + inactifs)</option>
      </select>
    </div>
    ${cardsHtml}`;
}

function renderTicketList() {
  const { tickets, filters, selectedTicketId, config } = state;
  const filtered = tickets.filter(t => {
    const matchStatus = filters.ticketStatus === "all" || t.status === filters.ticketStatus;
    const s = filters.ticketSearch.toLowerCase();
    const matchSearch = !s || t.title.toLowerCase().includes(s) || t.id.toLowerCase().includes(s);
    return matchStatus && matchSearch;
  }).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  const counts = { all: tickets.length };
  config.ticketStatuses.forEach(s => counts[s.id] = tickets.filter(t => t.status === s.id).length);

  const chips = `<button class="status-chip ${filters.ticketStatus==='all'?'active-all':''}" data-action="filter-ticket-status" data-status="all">Tous (${counts.all})</button>` +
    config.ticketStatuses.map(s => {
      const active = filters.ticketStatus === s.id;
      const style = active ? `background:${s.color}1F;color:${s.color};border-color:${s.color}` : "";
      return `<button class="status-chip" style="${style}" data-action="filter-ticket-status" data-status="${s.id}">${esc(s.label)} (${counts[s.id]||0})</button>`;
    }).join("");

  const rowsHtml = filtered.length === 0 ? emptyHtml("wrench","Aucun ticket","Aucune intervention ne correspond à ces critères.") :
    `<div class="card">` + filtered.map(t => `
      <div class="list-row ${selectedTicketId===t.id?'highlight':''}" data-action="goto-ticket" data-id="${t.id}">
        <span class="mono" style="font-size:11px;color:var(--text-ghost);width:112px;flex-shrink:0;">${t.id}</span>
        <div style="flex:1;min-width:180px;">
          <div style="font-size:14px;color:var(--text);">${esc(t.title)}</div>
          <div style="font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:4px;margin-top:2px;">${icon("map-pin",10)} ${esc(t.equipmentName)} · ${timeAgo(t.createdAt)}</div>
        </div>
        ${priorityDotHtml(t.priority)}
        ${statusPillHtml(t.status)}
      </div>`).join("") + `</div>`;

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title font-display">Interventions</h1>
        <p class="page-sub">${tickets.length} tickets au total</p>
      </div>

      ${icon("search",14)}
      <input class="input" id="ticket-search" placeholder="Rechercher un ticket..." value="${esc(filters.ticketSearch)}" />
    </div>
    ${rowsHtml}`;

  const provider = state.providers.find(p => p.id === t.providerId);
  const hasClosingInfo = t.interventionType || t.interventionResult || (t.parts && t.parts.length) || t.totalCost;

  const parts = t.parts || [];
  const partsRows = parts.length === 0 ? `<div style="padding:16px;font-size:12px;color:var(--text-ghost);text-align:center;">Aucune pièce consommée pour cette intervention</div>` :
    `<div style="overflow-x:auto;"><table style="width:100%;font-size:12px;border-collapse:collapse;">

function renderProviderList() {
  const { providers, filters, tickets } = state;
  const filtered = providers.filter(p => {
    const s = filters.providerSearch.toLowerCase();
    const matchSearch = !s || p.name.toLowerCase().includes(s) || p.contact.toLowerCase().includes(s);
    const matchType = filters.providerType === "all" || p.types.includes(filters.providerType);
    return matchSearch && matchType;
  });

  const cardsHtml = filtered.length === 0 ? emptyHtml("truck","Aucun prestataire trouvé","Ajoutez un fournisseur ou un sous-traitant pour commencer.") :
    `<div class="provider-grid">` + filtered.map(p => {
      const interventionCount = tickets.filter(t => t.providerId === p.id).length;
      const contractActive = p.contractEnd && new Date(p.contractEnd) > new Date();
      return `
        <div class="provider-card" data-action="goto-provider" data-id="${p.id}">
          <div class="provider-top">
            <div class="provider-avatar" style="background:#23282E;color:var(--orange);">${initials(p.name)}</div>
            <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">${p.types.map(typeBadgeHtml).join("")}</div>
          </div>
          <div class="provider-name">${esc(p.name)}</div>
          <div style="font-size:12px;color:var(--text-faint);margin:4px 0 10px;">${esc(p.contact)}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            ${starsHtml(p.rating)}
            <span class="mono" style="font-size:11px;color:var(--text-ghost);">${interventionCount} intervention${interventionCount!==1?"s":""}</span>
          </div>
        </div>`;
    }).join("") + `</div>`;

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title font-display">Prestataires</h1>
        <p class="page-sub">${providers.length} fournisseurs et sous-traitants référencés</p>
      </div>
      <button class="btn-primary" data-action="open-new-provider">${icon("plus",15)} Ajouter</button>
    </div>
    <div class="filters-row">
      <div class="search-wrap">
        ${icon("search",14)}
        <input class="input" id="provider-search" placeholder="Rechercher par nom, contact..." value="${esc(filters.providerSearch)}" />
      </div>
      <select class="input" id="provider-type-filter" style="width:auto;">
        <option value="all" ${filters.providerType==="all"?"selected":""}>Tous types</option>
        <option value="fournisseur" ${filters.providerType==="fournisseur"?"selected":""}>Fournisseur</option>
        <option value="sous-traitant" ${filters.providerType==="sous-traitant"?"selected":""}>Sous-traitant</option>
      </select>
    </div>
    ${cardsHtml}`;
}

    history.map(t => `

          <div>
            <div class="detail-id">${p.id}</div>
            <h1 class="detail-title font-display">${esc(p.name)}</h1>
            <div class="detail-meta-row">${p.types.map(typeBadgeHtml).join("")}${starsHtml(p.rating)}</div>
          </div>
        </div>
        <div class="detail-actions">
          <button class="icon-btn danger" data-action="delete-provider" data-id="${p.id}" title="Supprimer">${icon("trash-2",15)}</button>
          <button class="btn-secondary" data-action="open-edit-provider" data-id="${p.id}">${icon("pencil",14)} Modifier</button>
        </div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-col">
        <div class="card">
          <div class="card-header"><h2 class="card-title">Coordonnées</h2></div>
          <div class="specs-grid">
            <div><div class="spec-label">Contact</div><div class="spec-value">${esc(p.contact)}</div></div>
            <div><div class="spec-label">Téléphone</div><div class="spec-value">${esc(p.phone)}</div></div>
            <div><div class="spec-label">Email</div><div class="spec-value">${esc(p.email)}</div></div>
            <div><div class="spec-label">Adresse</div><div class="spec-value" style="font-family:'Inter',sans-serif;">${esc(p.address)}</div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h2 class="card-title">Historique des interventions</h2><span class="mono" style="font-size:12px;color:var(--text-ghost);">${history.length}</span></div>
          <div>${historyHtml}</div>
        </div>
      </div>
      <div class="detail-col">
        <div class="card" style="padding:16px;">
          <h2 class="card-title" style="margin-bottom:12px;">Contrat</h2>
          <div class="spec-label">Référence</div><div class="spec-value" style="margin-bottom:10px;">${esc(p.contractRef)}</div>

          ${p.contractEnd ? `<span class="warranty-badge" style="margin:0;background:${contractActive?'rgba(43,182,115,0.1)':'rgba(255,59,59,0.1)'};color:${contractActive?'#2BB673':'#FF3B3B'}">${icon("file-text",12)} ${contractActive?"Contrat actif":"Contrat expiré"}</span>` : ""}
        </div>
        <div class="card" style="padding:16px;">
          <h2 class="card-title" style="margin-bottom:12px;">Performance</h2>
          <div class="spec-label">Évaluation</div><div style="margin:4px 0 10px;">${starsHtml(p.rating, 16)}</div>
          <div class="spec-label">Délai moyen de livraison/intervention</div><div class="spec-value">${p.avgDeliveryDays} jour${p.avgDeliveryDays!==1?"s":""}</div>
        </div>
        <div class="card" style="padding:16px;">

function renderSettings() {
  const tabs = [
    { id: "restaurant", label: "Restaurant" },
    { id: "categories", label: "Catégories d'équipement" },
    { id: "locations", label: "Localisations" },
    { id: "statuses", label: "Statuts de ticket" },
    { id: "account", label: "Mon compte" },

  const tabsHtml = tabs.map(t => `<button class="settings-tab ${state.settingsTab===t.id?'active':''}" data-action="set-settings-tab" data-tab="${t.id}">${t.label}</button>`).join("");

  let content = "";
  if (state.settingsTab === "restaurant") content = renderRestaurantSettings();
  if (state.settingsTab === "categories") content = renderCategorySettings();
  if (state.settingsTab === "locations") content = renderLocationSettings();

  return `

}

function renderOverviewRows() {
  const restaurants = visibleRestaurants();
  const s = (state.overviewSearch || "").toLowerCase();
  const filtered = !s ? restaurants : restaurants.filter(r => r.name.toLowerCase().includes(s) || r.id.toLowerCase().includes(s) || r.city.toLowerCase().includes(s));

  if (filtered.length === 0) {
    return `<tr><td colspan="6" style="padding:24px 14px;text-align:center;color:var(--text-ghost);font-size:13px;">Aucun restaurant trouvé.</td></tr>`;
  }

  return filtered.map(r => {
    const completion = Math.max(0, 100 - r.panneCount * 6 - r.inactiveCount * 2);
    const alertColor = r.panneCount > 1 ? "var(--red)" : r.panneCount === 1 ? "#E8B339" : "var(--text-ghost)";
    return `
      <tr>
        <td class="mono" style="color:var(--text-ghost);">${r.id}</td>
        <td>${esc(r.name)}</td>
        <td>${r.equipCount - r.inactiveCount}/${r.equipCount}</td>
        <td style="color:${alertColor};">${r.panneCount ? `${icon("alert-triangle",13)} ${r.panneCount} panne${r.panneCount>1?"s":""}` : "—"}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden;max-width:80px;">
              <div style="height:100%;width:${completion}%;background:${completion>85?"#2BB673":completion>70?"#E8B339":"var(--red)"};"></div>
            </div>
            <span class="mono" style="font-size:11px;color:var(--text-ghost);">${completion}%</span>
          </div>
        </td>
        <td><button class="btn-secondary" data-action="enter-restaurant" data-id="${r.id}" style="padding:6px 12px;font-size:12px;">${icon("arrow-right-circle",14)} Entrer</button></td>
      </tr>`;
  }).join("");
}

    if (activeModal === "ticket") modalHtml = renderNewTicketModal();
    if (activeModal === "equip") modalHtml = renderNewEquipModal();
    if (activeModal === "provider") modalHtml = renderProviderModal();

function renderListOnly() {
  if (state.view === "overview") {
    const tbody = document.getElementById("overview-tbody");
    if (!tbody) return;
    const activeId = document.activeElement ? document.activeElement.id : null;
    const cursorPos = document.activeElement && "selectionStart" in document.activeElement ? document.activeElement.selectionStart : null;
    tbody.innerHTML = renderOverviewRows();
    if (window.lucide) lucide.createIcons();
    attachInputListeners();
    if (activeId) {
      const el = document.getElementById(activeId);
      if (el) { el.focus(); if (cursorPos !== null) el.setSelectionRange(cursorPos, cursorPos); }
    }
    return;
  }
  const main = document.querySelector("main");
  if (!main) return;
  const activeId = document.activeElement ? document.activeElement.id : null;
  const cursorPos = document.activeElement && "selectionStart" in document.activeElement ? document.activeElement.selectionStart : null;
  if (state.view === "equipment" && !state.selectedEquipId) main.innerHTML = renderEquipmentList();
  else if (state.view === "tickets" && !state.selectedTicketId) main.innerHTML = renderTicketList();
  else if (state.view === "providers" && !state.selectedProviderId) main.innerHTML = renderProviderList();
  if (window.lucide) lucide.createIcons();
  attachInputListeners();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); if (cursorPos !== null) el.setSelectionRange(cursorPos, cursorPos); }
  }
}

/* ============================================================
   PERSISTENCE
   ============================================================ */

async function persistEquipment(next) { state.equipment = next; state.saving = true; render(); await saveShared("equipment-list", next); state.saving = false; render(); }
async function persistTickets(next) { state.tickets = next; state.saving = true; render(); await saveShared("tickets-list", next); state.saving = false; render(); }
async function persistProviders(next) { state.providers = next; state.saving = true; render(); await saveShared("providers-list", next); state.saving = false; render(); }
async function persistConfig(next) { state.config = next; state.saving = true; render(); await saveShared("app-config", next); state.saving = false; render(); }

/* ============================================================
   ACTIONS — Modales génériques
   ============================================================ */

function openModal(type) { activeModal = type; render(); }
function closeModal() {
  activeModal = null;
  activePepSheet = null;
  Object.assign(newTicketState, { title:"", equipmentId:"", priority:"normale", description:"", reportedBy:"" });
  Object.assign(newEquipState, { name:"", category:"", brand:"", model:"", serial:"", supplier:"", location:"", installDate:"", warrantyEnd:"", purchaseValue:"", criticality:"normale" });
  Object.assign(newProviderState, { id:null, name:"", types:[], contact:"", phone:"", email:"", address:"", contractRef:"", contractEnd:"", rating:3, avgDeliveryDays:"", notes:"" });
  Object.assign(closingFormState, { ticketId:null, targetStatus:null, interventionType:"", providerId:"", interventionDate:"", arrivalTime:"", departureTime:"", parts:[], laborCost:"", orderRef:"", interventionResult:"" });
  render();
}

/* ---- Tickets ---- */

async function createTicket() {
  if (!newTicketState.title || !newTicketState.reportedBy) return;
  const eq = state.equipment.find(e => e.id === newTicketState.equipmentId);
  const defaultStatus = state.config.ticketStatuses[0]?.id || "ouvert";
  const newTicket = {
    id: genTicketId(state.tickets),
    title: newTicketState.title,
    equipmentId: newTicketState.equipmentId,
    equipmentName: eq ? eq.name : "",
    location: eq ? eq.location : "",
    priority: newTicketState.priority,
    status: defaultStatus,
    reportedBy: newTicketState.reportedBy,
    assignedTo: null,
    providerId: null,
    createdAt: new Date().toISOString(),
    description: newTicketState.description,
    arrivalTime: "", departureTime: "", interventionType: "", parts: [], laborCost: 0, totalCost: 0, orderRef: "", interventionResult: "",
    notes: [],
  };
  await persistTickets([newTicket, ...state.tickets]);
  state.view = "tickets";
  state.selectedTicketId = newTicket.id;
  closeModal();
}

async function updateTicket(id, patch) {
  const ticket = state.tickets.find(t => t.id === id);
  const next = state.tickets.map(t => t.id === id ? { ...t, ...patch } : t);
  await persistTickets(next);
  const terminalStatuses = state.config.ticketStatuses.slice(-2).map(s => s.id);
  if (patch.status && terminalStatuses.includes(patch.status) && ticket) {
    await persistEquipment(state.equipment.map(e => e.id === ticket.equipmentId ? { ...e, status:"operational", lastIntervention: new Date().toISOString().slice(0,10) } : e));
  }
}

function addNote() {
  const input = document.getElementById("note-input");
  const text = input ? input.value.trim() : "";
  if (!text) return;
  const t = state.tickets.find(t => t.id === state.selectedTicketId);
  if (!t) return;
  const author = t.assignedTo || "Technicien";
  updateTicket(t.id, { notes: [...t.notes, { author, text, at: new Date().toISOString() }] });
}
function assignProviderToTicket(providerId) {
  const t = state.tickets.find(t => t.id === state.selectedTicketId);
  if (!t) return;
  updateTicket(t.id, { providerId: providerId || null });
}

/* ---- Équipements ---- */

async function createEquip() {
  if (!newEquipState.name || !newEquipState.brand || !newEquipState.model) return;
  const newEq = {
    id: genEquipId(state.equipment),
    name: newEquipState.name,
    category: newEquipState.category,
    brand: newEquipState.brand,
    model: newEquipState.model,
    serial: newEquipState.serial || "—",
    supplier: newEquipState.supplier || "—",
    location: newEquipState.location,
    installDate: newEquipState.installDate || new Date().toISOString().slice(0,10),
    warrantyEnd: newEquipState.warrantyEnd || "—",
    purchaseValue: Number(newEquipState.purchaseValue) || 0,
    status: "operational",
    criticality: newEquipState.criticality,
    lastIntervention: null,
    active: true,
  };
  await persistEquipment([...state.equipment, newEq]);
  state.view = "equipment";
  state.selectedEquipId = newEq.id;
  closeModal();
}

async function deleteEquip(id) {
  if (!confirm("Supprimer définitivement cet équipement ? Les tickets liés resteront mais perdront le lien équipement.")) return;
  await persistEquipment(state.equipment.filter(e => e.id !== id));
  state.selectedEquipId = null;
  render();
}

async function toggleEquipActive(id) {
  const eq = state.equipment.find(e => e.id === id);
  if (!eq) return;
  await persistEquipment(state.equipment.map(e => e.id === id ? { ...e, active: !e.active } : e));
}

function nextDuplicateName(baseName, existingNames) {
  const m = baseName.match(/^(.*)#(\d+)\s*$/);
  const root = (m ? m[1] : baseName + " ").trim();
  let n = m ? parseInt(m[2], 10) + 1 : 2;
  let candidate = `${root} #${n}`;
  while (existingNames.includes(candidate)) { n++; candidate = `${root} #${n}`; }
  return candidate;
}

async function duplicateEquip(id) {
  const eq = state.equipment.find(e => e.id === id);
  if (!eq) return;
  const existingNames = state.equipment.map(e => e.name);
  const newEq = {
    ...eq,
    id: genEquipId(state.equipment),
    name: nextDuplicateName(eq.name, existingNames),
    serial: "—",
    status: "operational",
    lastIntervention: null,
    active: true,
  };
  await persistEquipment([...state.equipment, newEq]);
  state.view = "equipment";
  state.selectedEquipId = newEq.id;
  render();
}

/* ---- Prestataires ---- */

function toggleProviderType(type) {
  const idx = newProviderState.types.indexOf(type);
  if (idx >= 0) newProviderState.types.splice(idx, 1);
  else newProviderState.types.push(type);
  openModal("provider");
}
function setProviderRating(r) { newProviderState.rating = r; openModal("provider"); }

async function saveProvider() {
  if (!newProviderState.name || newProviderState.types.length === 0) return;
  const isEdit = !!newProviderState.id;
  const payload = {
    id: isEdit ? newProviderState.id : genProviderId(state.providers),
    name: newProviderState.name,
    types: [...newProviderState.types],
    contact: newProviderState.contact || "—",
    phone: newProviderState.phone || "—",
    email: newProviderState.email || "—",
    address: newProviderState.address || "—",
    contractRef: newProviderState.contractRef || "—",
    contractEnd: newProviderState.contractEnd || null,
    rating: newProviderState.rating,
    avgDeliveryDays: Number(newProviderState.avgDeliveryDays) || 0,
    notes: newProviderState.notes || "",
  };
  if (isEdit) {
    await persistProviders(state.providers.map(p => p.id === payload.id ? payload : p));
  } else {
    await persistProviders([...state.providers, payload]);
  }
  state.view = "providers";
  state.selectedProviderId = payload.id;
  closeModal();
}

function openEditProvider(id) {
  const p = state.providers.find(p => p.id === id);
  if (!p) return;
  Object.assign(newProviderState, {
    id: p.id, name: p.name, types: [...p.types], contact: p.contact, phone: p.phone, email: p.email,
    address: p.address, contractRef: p.contractRef === "—" ? "" : p.contractRef, contractEnd: p.contractEnd || "",
    rating: p.rating, avgDeliveryDays: p.avgDeliveryDays || "", notes: p.notes === "—" ? "" : p.notes,
  });
  openModal("provider");
}

function openPepSheet(categoryId, ref) {
  const sheet = getPepSheetsForCategory(categoryId).find(s => s.ref === ref);
  if (!sheet) return;
  activePepSheet = sheet;
  openModal("pep");
}

async function deleteProvider(id) {
  if (!confirm("Supprimer définitivement ce prestataire ?")) return;
  await persistProviders(state.providers.filter(p => p.id !== id));
  state.selectedProviderId = null;
  render();
}

/* ---- Clôture d'intervention ---- */

function openClosingModal(ticketId, targetStatus) {
  const t = state.tickets.find(t => t.id === ticketId);
  if (!t) return;
  Object.assign(closingFormState, {
    ticketId,
    targetStatus,
    interventionType: t.interventionType || "",
    providerId: t.providerId || "",
    interventionDate: t.interventionDate || todayDateValue(),
    arrivalTime: t.arrivalTime || "",
    departureTime: t.departureTime || "",
    parts: t.parts ? t.parts.map(p => ({ ...p })) : [],
    laborCost: t.laborCost || "",
    orderRef: t.orderRef || "",
    interventionResult: t.interventionResult || "",
  });
  openModal("closing");
}

function refreshAddCategoryButton() {
  const btn = document.getElementById("add-category-btn");
  if (btn) btn.disabled = !newCategoryState.label;
}

function refreshAddStatusButton() {
  const btn = document.getElementById("add-status-btn");
  if (btn) btn.disabled = !newStatusState.label;
}

function refreshSaveProviderButton() {
  const btn = document.getElementById("save-provider-btn");
  if (!btn) return;
  const valid = newProviderState.name && newProviderState.types.length > 0;
  btn.disabled = !valid;
}

function refreshNewEquipButton() {
  const btn = document.getElementById("create-equip-btn");
  if (!btn) return;
  const valid = newEquipState.name && newEquipState.brand && newEquipState.model;
  btn.disabled = !valid;
}

function refreshNewTicketButton() {
  const btn = document.getElementById("create-ticket-btn");
  if (!btn) return;
  const valid = newTicketState.title && newTicketState.reportedBy;
  btn.disabled = !valid;
}

function refreshPartSubtotal() {
  const qtyEl = document.getElementById("cl-part-qty");
  const costEl = document.getElementById("cl-part-cost");
  const subtotalEl = document.getElementById("cl-part-subtotal");
  if (!subtotalEl) return;
  const qty = Number(qtyEl?.value) || 0;
  const cost = Number(costEl?.value) || 0;
  subtotalEl.textContent = (qty * cost).toLocaleString("fr-MA") + " MAD";
}

function refreshClosingTotals() {
  const f = closingFormState;
  const partsCost = f.parts.reduce((s,p) => s + (Number(p.cost)||0) * (Number(p.qty)||1), 0);
  const totalCost = partsCost + (Number(f.laborCost)||0);
  const partsEl = document.getElementById("cl-parts-total");
  const totalEl = document.getElementById("cl-grand-total");
  if (partsEl) partsEl.textContent = partsCost.toLocaleString("fr-MA") + " MAD";
  if (totalEl) totalEl.textContent = totalCost.toLocaleString("fr-MA") + " MAD";
}

function addClosingPart() {
  const name = document.getElementById("cl-part-name")?.value.trim();
  const ref = document.getElementById("cl-part-ref")?.value.trim();
  const qty = document.getElementById("cl-part-qty")?.value;
  const source = document.getElementById("cl-part-source")?.value;
  const cost = document.getElementById("cl-part-cost")?.value;
  if (!name) return;
  closingFormState.parts.push({ name, ref: ref || "—", qty: Number(qty)||1, source: source || "achat", cost: Number(cost)||0 });
  render();
}

function removeClosingPart(index) {
  closingFormState.parts.splice(index, 1);
  render();
}

async function confirmClosing() {
  if (closingInProgress) return;
  const f = closingFormState;
  if (!f.ticketId || !f.targetStatus) { closeModal(); return; }

  closingInProgress = true;
  render();
  try {
    const partsCost = f.parts.reduce((s,p) => s + (Number(p.cost)||0) * (Number(p.qty)||1), 0);
    const totalCost = partsCost + (Number(f.laborCost)||0);
    await updateTicket(f.ticketId, {
      status: f.targetStatus,
      interventionType: f.interventionType,
      providerId: f.providerId || null,
      interventionDate: f.interventionDate,
      arrivalTime: f.arrivalTime,
      departureTime: f.departureTime,
      parts: f.parts,
      laborCost: Number(f.laborCost) || 0,
      totalCost,
      orderRef: f.orderRef,
      interventionResult: f.interventionResult,
    });
    closingInProgress = false;
    closeModal();
  } catch (err) {
    closingInProgress = false;
    console.error("Erreur lors de la clôture du ticket :", err);
    alert("La clôture n'a pas pu être enregistrée (problème de connexion au stockage). Réessayez dans un instant.");
    render();
  }
}

/* ---- Paramètres : Restaurant ---- */

let autoSaveRestaurantTimer = null;

function scheduleAutoSaveRestaurant() {
  state.restaurantAutoSaveStatus = "pending";
  if (autoSaveRestaurantTimer) clearTimeout(autoSaveRestaurantTimer);
  autoSaveRestaurantTimer = setTimeout(() => { flushAutoSaveRestaurant(); }, 800);
}

async function flushAutoSaveRestaurant() {
  if (autoSaveRestaurantTimer) { clearTimeout(autoSaveRestaurantTimer); autoSaveRestaurantTimer = null; }
  if (!restaurantFormState) return;
  const before = JSON.stringify(state.config.restaurant || {});
  const after = JSON.stringify(restaurantFormState);
  if (before === after) return;
  await saveRestaurant();
  state.restaurantAutoSaveStatus = "saved";
  render();
}

async function saveRestaurant() {
  if (!restaurantFormState) return;
  await persistConfig({ ...state.config, restaurant: { ...restaurantFormState } });
}

async function resetRestaurantData() {
  if (!confirm("Effacer tous les tickets et remettre tous les équipements en \"Opérationnel\" pour ce restaurant ? Cette action est irréversible.")) return;
  const cleanEquipment = SEED_EQUIPMENT.map(eq => ({ ...eq, active: true, status: "operational" }));
  await persistEquipment(cleanEquipment);
  await persistTickets([]);
  alert("Données réinitialisées : parc 100% opérationnel, aucun ticket.");
}

/* ---- Mon compte : changement de mot de passe ---- */

async function changePassword() {
  const s = accountPasswordState;
  if (!supabaseClient) return;

  if (!s.newPassword || s.newPassword.length < 6) {
    s.status = "error";
    s.message = "Le mot de passe doit contenir au moins 6 caractères.";
    render();
    return;
  }
  if (s.newPassword !== s.confirmPassword) {
    s.status = "error";
    s.message = "Les deux mots de passe ne correspondent pas.";
    render();
    return;
  }

  s.status = "saving";
  s.message = "";
  render();

  const { error } = await supabaseClient.auth.updateUser({ password: s.newPassword });

  if (error) {
    s.status = "error";
    s.message = "Échec de la modification : " + error.message;
  } else {
    s.status = "success";
    s.message = "Mot de passe modifié avec succès.";
    s.newPassword = "";
    s.confirmPassword = "";
  }
  render();
}

/* ---- Paramètres : Catégories ---- */

function pickCatColor(color) { newCategoryState.color = color; render(); }
function pickCatIcon(ic) { newCategoryState.icon = ic; render(); }

async function addCategory() {
  if (!newCategoryState.label.trim()) return;
  const newCat = { id: slugify(newCategoryState.label) + "_" + Date.now().toString(36), label: newCategoryState.label.trim(), color: newCategoryState.color, icon: newCategoryState.icon };
  await persistConfig({ ...state.config, categories: [...state.config.categories, newCat] });
  Object.assign(newCategoryState, { label:"", color: COLOR_PALETTE[0], icon: ICON_PALETTE[0] });

}
async function deleteCategory(id) {

  if (inUse > 0 && !confirm(`${inUse} équipement(s) utilisent cette catégorie. La supprimer quand même ?`)) return;
  await persistConfig({ ...state.config, categories: state.config.categories.filter(c => c.id !== id) });
}

/* ---- Paramètres : Localisations ---- */

async function addLocation() {
  const input = document.getElementById("new-location");
  const val = input ? input.value.trim() : "";
  if (!val || state.config.locations.includes(val)) return;
  await persistConfig({ ...state.config, locations: [...state.config.locations, val] });
}
async function deleteLocation(loc) {
  const inUse = state.equipment.filter(e => e.location === loc).length;
  if (inUse > 0 && !confirm(`${inUse} équipement(s) utilisent cette localisation. La supprimer quand même ?`)) return;
  await persistConfig({ ...state.config, locations: state.config.locations.filter(l => l !== loc) });
}

/* ---- Paramètres : Statuts ---- */

function pickStatusColor(color) { newStatusState.color = color; render(); }

async function addStatus() {
  if (!newStatusState.label.trim()) return;
  const newStatus = { id: slugify(newStatusState.label) + "_" + Date.now().toString(36), label: newStatusState.label.trim(), color: newStatusState.color, icon: "circle-dot" };
  await persistConfig({ ...state.config, ticketStatuses: [...state.config.ticketStatuses, newStatus] });
  Object.assign(newStatusState, { label:"", color: COLOR_PALETTE[0] });
  render();
}
async function deleteStatus(id) {
  if (state.config.ticketStatuses.length <= 1) { alert("Impossible de supprimer le dernier statut restant."); return; }
  const inUse = state.tickets.filter(t => t.status === id).length;
  if (inUse > 0 && !confirm(`${inUse} ticket(s) utilisent ce statut. La supprimer quand même ?`)) return;
  await persistConfig({ ...state.config, ticketStatuses: state.config.ticketStatuses.filter(s => s.id !== id) });
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */

document.addEventListener("click", (e) => {
  if (e.target.id === "mobile-menu-btn" || e.target.closest("#mobile-menu-btn")) {
    state.mobileNavOpen = !state.mobileNavOpen;
    render();
    return;
  }
  if (e.target.id === "modal-overlay") { closeModal(); return; }

  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action !== "save-restaurant" && (action === "nav" || action === "set-settings-tab")) {
    flushAutoSaveRestaurant();
  }

  switch (action) {
    case "nav":
      state.view = el.dataset.view;
      state.mobileNavOpen = false;
      if (el.dataset.view === "equipment") state.selectedEquipId = null;
      if (el.dataset.view === "tickets") state.selectedTicketId = null;
      if (el.dataset.view === "providers") state.selectedProviderId = null;
      render();
      break;
    case "goto-ticket": state.view = "tickets"; state.selectedTicketId = el.dataset.id; render(); break;
    case "goto-equip": state.view = "equipment"; state.selectedEquipId = el.dataset.id; render(); break;
    case "goto-provider": state.view = "providers"; state.selectedProviderId = el.dataset.id; render(); break;
    case "back-equip": state.selectedEquipId = null; render(); break;
    case "back-ticket": state.selectedTicketId = null; render(); break;
    case "back-provider": state.selectedProviderId = null; render(); break;

    case "open-new-ticket": if (el.dataset.equip) newTicketState.equipmentId = el.dataset.equip; openModal("ticket"); break;
    case "open-new-equip": openModal("equip"); break;
    case "open-new-provider": openModal("provider"); break;
    case "open-edit-provider": openEditProvider(el.dataset.id); break;
    case "open-pep": openPepSheet(el.dataset.cat, el.dataset.ref); break;
    case "close-modal": closeModal(); break;

    case "set-new-ticket-priority": newTicketState.priority = el.dataset.priority; openModal("ticket"); break;
    case "set-new-equip-cat": newEquipState.category = el.dataset.cat; openModal("equip"); break;
    case "toggle-provider-type": toggleProviderType(el.dataset.type); break;
    case "set-provider-rating": setProviderRating(parseInt(el.dataset.rating,10)); break;

    case "create-ticket": createTicket(); break;
    case "create-equip": createEquip(); break;
    case "save-provider": saveProvider(); break;

    case "delete-equip": deleteEquip(el.dataset.id); break;
    case "toggle-equip-active": toggleEquipActive(el.dataset.id); break;
    case "duplicate-equip": duplicateEquip(el.dataset.id); break;
    case "delete-provider": deleteProvider(el.dataset.id); break;

    case "login": {
      const u = document.getElementById("login-username")?.value || "";
      const p = document.getElementById("login-password")?.value || "";
      handleLogin(u, p);
      break;
    }
    case "logout": logout(); break;
    case "enter-restaurant": enterRestaurant(el.dataset.id); break;
    case "back-to-overview": backToOverview(); break;

    case "filter-ticket-status": state.filters.ticketStatus = el.dataset.status; render(); break;
    case "set-ticket-status": updateTicket(state.selectedTicketId, { status: el.dataset.status }); break;
    case "open-closing": openClosingModal(state.selectedTicketId, el.dataset.status); break;
    case "add-closing-part": addClosingPart(); break;
    case "cl-today": {
      closingFormState.interventionDate = todayDateValue();
      const el = document.getElementById("cl-date");
      if (el) el.value = closingFormState.interventionDate;
      break;
    }
    case "cl-now-arrival": {
      closingFormState.arrivalTime = nowTimeValue();
      const el = document.getElementById("cl-arrival");
      if (el) el.value = closingFormState.arrivalTime;
      break;
    }
    case "cl-now-departure": {
      closingFormState.departureTime = nowTimeValue();
      const el = document.getElementById("cl-departure");
      if (el) el.value = closingFormState.departureTime;
      break;
    }
    case "remove-closing-part": removeClosingPart(parseInt(el.dataset.index,10)); break;
    case "confirm-closing": confirmClosing(); break;
    case "add-note": addNote(); break;

    case "set-settings-tab": state.settingsTab = el.dataset.tab; render(); break;
    case "pick-cat-color": pickCatColor(el.dataset.color); break;
    case "pick-cat-icon": pickCatIcon(el.dataset.icon); break;
    case "save-restaurant": saveRestaurant(); break;
    case "reset-restaurant-data": resetRestaurantData(); break;
    case "change-password": changePassword(); break;
    case "add-category": addCategory(); break;
    case "delete-category": deleteCategory(el.dataset.id); break;
    case "add-location": addLocation(); break;
    case "delete-location": deleteLocation(el.dataset.loc); break;
    case "pick-status-color": pickStatusColor(el.dataset.color); break;
    case "add-status": addStatus(); break;
    case "delete-status": deleteStatus(el.dataset.id); break;
  }
});

/* ============================================================
   INITIALISATION & SESSION MULTI-RESTAURANT
   ============================================================ */

let pollingInterval = null;

function seedForRestaurant(restaurantId) {
  const meta = RESTAURANTS_REGISTRY.find(r => r.id === restaurantId);
  if (!meta) {
    // Restaurant inconnu du registre (ne devrait pas arriver) : standard par défaut
    return { equipment: SEED_EQUIPMENT, tickets: SEED_TICKETS, restaurant: DEFAULT_RESTAURANT };
  }
  return buildRestaurantData(meta);
}

async function loadRestaurantData(restaurantId) {
  state.activeRestaurantId = restaurantId;
  state.loading = true;
  render();

  const seed = seedForRestaurant(restaurantId);

  const eq = await loadShared("equipment-list", null);
  const tk = await loadShared("tickets-list", null);
  const pr = await loadShared("providers-list", null);
  const cfg = await loadShared("app-config", null);

  state.equipment = eq || seed.equipment;
  state.tickets = tk || seed.tickets;
  state.providers = pr || SEED_PROVIDERS;
  state.config = cfg || { categories: DEFAULT_CATEGORIES, locations: DEFAULT_LOCATIONS, ticketStatuses: DEFAULT_TICKET_STATUSES, restaurant: seed.restaurant };
  if (!state.config.restaurant) state.config.restaurant = seed.restaurant;

  if (!eq) await saveShared("equipment-list", state.equipment);
  if (!tk) await saveShared("tickets-list", state.tickets);
  if (!pr) await saveShared("providers-list", state.providers);
  if (!cfg) await saveShared("app-config", state.config);

  state.loading = false;
  state.selectedEquipId = null;
  state.selectedTicketId = null;
  state.selectedProviderId = null;
  render();
  startPolling();
}

function startPolling() {
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(async () => {
    if (!state.activeRestaurantId) return;
    const eq2 = await loadShared("equipment-list", null);
    const tk2 = await loadShared("tickets-list", null);
    const pr2 = await loadShared("providers-list", null);
    const cfg2 = await loadShared("app-config", null);
    let changed = false;
    if (eq2 && JSON.stringify(eq2) !== JSON.stringify(state.equipment)) { state.equipment = eq2; changed = true; }
    if (tk2 && JSON.stringify(tk2) !== JSON.stringify(state.tickets)) { state.tickets = tk2; changed = true; }
    if (pr2 && JSON.stringify(pr2) !== JSON.stringify(state.providers)) { state.providers = pr2; changed = true; }
    if (cfg2 && JSON.stringify(cfg2) !== JSON.stringify(state.config)) { state.config = cfg2; changed = true; }
    if (changed && !activeModal) render();
  }, 8000);
}

function stopPolling() {
  if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
}

async function handleLogin(username, password) {
  state.loginError = "";
  state.loginLoading = true;
  render();

  if (supabaseClient) {
    const email = username.trim();
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error || !data.session) {
      state.loginLoading = false;
      state.loginError = "Identifiant ou mot de passe incorrect.";
      render();
      return;
    }
    const profile = await fetchProfile(data.user.id);
    if (!profile) {
      state.loginLoading = false;
      state.loginError = "Compte connecté mais aucun profil trouvé. Contactez un administrateur.";
      await supabaseClient.auth.signOut();
      render();
      return;
    }
    state.loginLoading = false;
    applySession(profile);
    return;
  }

  // Mode local (démo, sans Supabase)
  const user = DEMO_USERS.find(u => u.username === username.trim().toLowerCase() && u.password === password);
  state.loginLoading = false;
  if (!user) {
    state.loginError = "Identifiant ou mot de passe incorrect.";
    render();
    return;
  }
  applySession(user);
}

async function fetchProfile(userId) {
  const { data, error } = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
  if (error || !data) return null;
  return { username: data.email || data.id, role: data.role, restaurantId: data.restaurant_id || undefined, market: data.market || undefined, label: data.label };
}

async function applySession(user) {
  state.session = user;
  if (user.role === "site") {
    state.view = "dashboard";
    await loadRestaurantData(user.restaurantId);
  } else {
    state.view = "overview";
    state.activeRestaurantId = null;
    render();
  }
}

function logout() {
  flushAutoSaveRestaurant();
  stopPolling();
  if (supabaseClient) supabaseClient.auth.signOut();
  state.session = null;
  state.activeRestaurantId = null;
  state.view = "login";
  state.loginError = "";
  state.equipment = []; state.tickets = []; state.providers = [];
  state.config = { categories: [], locations: [], ticketStatuses: [], restaurant: {} };
  render();
}

// Bascule régionale : un responsable régional entre dans un restaurant précis
async function enterRestaurant(restaurantId) {
  state.view = "dashboard";
  await loadRestaurantData(restaurantId);
}

// Retour à la vue consolidée (uniquement pour les responsables régionaux)
function backToOverview() {
  stopPolling();
  state.activeRestaurantId = null;
  state.view = "overview";
  render();
}

window.addEventListener("beforeunload", () => { flushAutoSaveRestaurant(); });

async function initApp() {
  if (supabaseClient) {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      const profile = await fetchProfile(data.session.user.id);
      if (profile) { await applySession(profile); return; }
      await supabaseClient.auth.signOut();
    }
  }
  render();
}

initApp();
